<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital Directory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #0c6b3c 0%, #084a2a 52%, #052e1b 100%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(55% 45% at 12% 18%, rgba(90,210,150,0.30), transparent 70%),
        radial-gradient(50% 45% at 88% 82%, rgba(20,120,80,0.42), transparent 72%);
    }
    body > * { position: relative; z-index: 1; }
    .hero {
      padding: 28px 20px 6px;
      text-align: center;
    }
    .hero img {
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      box-shadow: 0 6px 22px rgba(0, 60, 30, 0.18);
      display: block;
      margin: 0 auto;
    }
    .hero .subtitle {
      margin-top: 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: #005c2e;
    }
    main {
      flex: 1;
      padding: 20px 20px 28px;
      max-width: 440px;
      margin: 0 auto;
      width: 100%;
    }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      margin-bottom: 12px;
    }
    .nav-list { display: flex; flex-direction: column; gap: 10px; }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 12px;
      padding: 16px 18px;
      text-decoration: none;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 8px 26px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: background 0.18s, transform 0.18s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.17); transform: translateY(-2px); }
    .nav-btn .arrow { color: rgba(255,255,255,0.65); font-size: 18px; }
    .site-banner { background: #ffffff; text-align: center; line-height: 0; }
    .site-banner img, .site-banner video { display: inline-block; width: 100%; max-width: 520px; height: auto; vertical-align: top; }
    .topbar { background: rgba(4,50,28,0.5); backdrop-filter: blur(12px) saturate(1.3); -webkit-backdrop-filter: blur(12px) saturate(1.3); border-bottom: 1px solid rgba(255,255,255,0.12); padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    .topbar h1 { color: #fff; font-size: 16px; font-weight: 600; }
    footer {
      text-align: center;
      padding: 16px;
      font-size: 11px;
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>
  <div class="site-banner">
    <video class="site-banner-vid" autoplay muted playsinline preload="auto" poster="banner_poster.jpg"><source src="intro.mp4" type="video/mp4"><img src="banner_poster.jpg" alt="King Faisal Specialist Hospital &amp; Research Centre"></video>
  </div>

    <h1>Hospital Directory</h1>
    <a href="index.html" style="margin-left:auto;font-size:14px;font-weight:600;text-decoration:none;color:#fff;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);padding:6px 12px;border-radius:999px;">&#127968; Home</a>
  </header>
  <main>
    <p class="section-label">Select a directory</p>
    <div class="nav-list">
      <a class="nav-btn" href="general_directory.html">
        <span>General Hospital Directory</span>
        <span class="arrow">&#8250;</span>
      </a>
      <a class="nav-btn" href="doctors.html">

        <span class="arrow">&#8250;</span>

      <a class="nav-btn" href="c3_patient_rooms.html">

      </a>
    </div>
  </main>
  <footer>King Faisal Specialist Hospital &amp; Research Centre</footer>
  <!-- AUTO-REFRESH v1 : reload if this page's file changes on the server, so screens left open stay current -->
  <script>
  (function () {
    var url = location.pathname.split('#')[0].split('?')[0];
    var baseline = null, pending = false;
    function sig(h) { return h.get('ETag') || h.get('Last-Modified') || null; }
    function check() {
      fetch(url + '?_=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) return;
          var s = sig(r.headers);
          if (!s) return;
          if (baseline === null) { baseline = s; return; }
          if (s !== baseline) { if (document.hidden) location.reload(); else pending = true; }
        })
        .catch(function () {});
    }
    document.addEventListener('visibilitychange', function () {
      if (pending && !document.hidden) location.reload();
    });
    check();
    setInterval(function () { if (pending) location.reload(); else check(); }, 90000);
  })();
  </script>
  <script>
  /* BANNER-LOOP v1: replay the intro logo every 5s */
  (function(){
    function arm(){
      var v=document.querySelector('.site-banner-vid'); if(!v) return;
      var play=function(){ try{ v.currentTime=0; var p=v.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){} };
      play(); setInterval(play, 5000);
    }
    if(document.readyState!=='loading') arm(); else document.addEventListener('DOMContentLoaded', arm);
  })();
  </script>
</body>
</html>
