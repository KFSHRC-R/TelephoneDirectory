<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a4a2a">
  <title>C3 Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --banner-green: #439652;
      --brand-green-dark: #044a27;
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: linear-gradient(160deg, #0c6b3c 0%, #084a2a 52%, #052e1b 100%);
      background-attachment: fixed;
      font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }
    /* soft colour blobs so the frosted glass has something to blur */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(55% 45% at 12% 18%, rgba(90,210,150,0.32), transparent 70%),
        radial-gradient(50% 45% at 88% 82%, rgba(20,120,80,0.42), transparent 72%);
    }
    body > * { position: relative; z-index: 1; }

    /* ---- Banner + title bar ---- */
    .banner-bar { background: var(--banner-green); display: flex; justify-content: center; width: 100%; }
    .banner-bar img { display: block; width: 100%; max-width: 680px; height: auto; }
    .title-bar {
      background: rgba(4, 50, 28, 0.55);
      backdrop-filter: blur(12px) saturate(1.3);
      -webkit-backdrop-filter: blur(12px) saturate(1.3);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      color: #ffffff;
      text-align: center;
      padding: 13px 18px;
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 20px 32px;
      width: 100%;
    }
    .container { width: 100%; max-width: 720px; }

    .greeting { text-align: center; margin-bottom: 40px; }
    .greeting h1 {
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-size: 34px; font-weight: 700; color: #ffffff; line-height: 1.15;
      text-shadow: 0 2px 18px rgba(0,0,0,0.25);
    }
    .greeting p { font-size: 18px; color: rgba(255,255,255,0.82); margin-top: 6px; }

    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; }

    /* ---- Frosted glass cards ---- */
    .card {
      position: relative;
      min-height: 200px;
      padding: 28px;
      border-radius: 24px;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 10px 40px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.18);
      transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover { transform: translateY(-6px); background: rgba(255,255,255,0.16); box-shadow: 0 22px 52px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.25); }
    .card:active { transform: translateY(-2px); }
    .card:focus-visible { outline: 3px solid rgba(255,255,255,0.7); outline-offset: 3px; }

    .icon-chip {
      width: 58px; height: 58px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    .icon-chip svg { width: 30px; height: 30px; }

    .card h2 {
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-size: 22px; font-weight: 600; color: #ffffff; margin-bottom: 6px;
    }
    .card .desc { font-size: 15px; color: rgba(255,255,255,0.80); line-height: 1.45; }

    .chevron {
      position: absolute; top: 24px; right: 26px;
      font-family: 'Baloo 2', system-ui, sans-serif; font-size: 30px; line-height: 1;
      color: rgba(255,255,255,0.55); transition: transform 0.22s ease, color 0.22s ease;
    }
    .card:hover .chevron { transform: translateX(4px); color: #ffffff; }

    footer { text-align: center; font-size: 13px; color: rgba(255,255,255,0.6); padding: 0 24px 28px; }

    @media (max-width: 560px) {
      .title-bar { font-size: 19px; padding: 11px 16px; }
      main { padding: 34px 16px 24px; }
      .greeting { margin-bottom: 26px; }
      .greeting h1 { font-size: 28px; }
      .greeting p { font-size: 16px; }
      .card-grid { grid-template-columns: 1fr; gap: 16px; }
      .card { min-height: 0; padding: 24px; }
    }
  </style>
</head>
